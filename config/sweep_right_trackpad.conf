# i2c
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

# pointing device
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# PR3110 v2 hardening: bigger queue for high-rate Cirque trackpad bursts.
# Default is 32; bumped to 64 to reduce drops during ~100Hz report bursts.
# RAM cost on nRF52840: ~768 bytes.
CONFIG_ZMK_INPUT_SPLIT_MSG_QUEUE_SIZE=64

# logging (trackpad diagnosis)
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# BT-side logging for next round of disconnect triage on the peripheral
# half. Surfaces bt_conn/bt_gatt warnings (the central log at bb594f2 was
# missing these, leaving us blind to the central-side view of the storm).
CONFIG_BT_CONN_LOG_LEVEL_WRN=y
CONFIG_BT_GATT_LOG_LEVEL_WRN=y
CONFIG_BT_HCI_CORE_LOG_LEVEL_WRN=y
