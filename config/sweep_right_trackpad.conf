# i2c
CONFIG_I2C=y
CONFIG_I2C_NRFX=y

# pointing device
CONFIG_INPUT_THREAD_STACK_SIZE=4096

# PR3110 v2 hardening: bigger queue for high-rate Cirque trackpad bursts.
# Default is 32; bumped to 64 to reduce drops during ~100Hz report bursts.
# RAM cost on nRF52840: ~768 bytes.
CONFIG_ZMK_INPUT_SPLIT_MSG_QUEUE_SIZE=64
